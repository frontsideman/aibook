meta:
  profile: engineering-review
  theme: tech-blue
  layout: vertical
  canvas: auto
  routing: orthogonal
  title: Database Schema — Prisma Models
  description: Entity relationship diagram of all 6 Prisma models with enums
modules:
  - id: enums
    label: Enums
    color: '#FEF3C7'
  - id: models
    label: Models
    color: '#E0F2FE'
nodes:
  - id: bookStatus
    label: |-
      BookStatus
      {DRAFT | GENERATING | REVIEW | COMPLETED}
    type: document
    module: enums
    size: xl
    style:
      fillColor: '#FDE68A'
  - id: bookType
    label: |-
      BookType
      {AI_ADAPTED | MANUAL}
    type: document
    module: enums
    size: large
    style:
      fillColor: '#FDE68A'
  - id: bookStyle
    label: |-
      BookStyle
      {WATERCOLOR | CARTOON | REALISTIC | PIXAR | SKETCH | MANGA | COMIC}
    type: document
    module: enums
    size: xl
    style:
      fillColor: '#FDE68A'
  - id: tone
    label: |-
      Tone
      {WARM | EDUCATIONAL | PLAYFUL | MAGICAL | ADVENTUROUS}
    type: document
    module: enums
    size: xl
    style:
      fillColor: '#FDE68A'
  - id: userModel
    label: |-
      User
      id / email (uniq) / subActive
      timestamps
    type: service
    module: models
    size: xl
    style:
      fillColor: '#BFDBFE'
  - id: childProfileModel
    label: |-
      ChildProfile
      id / name / age / gender
      interests[] / userId (FK)
      timestamps
    type: service
    module: models
    size: xl
    style:
      fillColor: '#BFDBFE'
  - id: bookModel
    label: |-
      Book
      id / title / status / type
      style / tone? / comments?
      feedback? / pdfUrl? / approvedAt?
      userId (FK) / childId (FK)
      timestamps
    type: service
    module: models
    size: xl
    style:
      fillColor: '#BFDBFE'
  - id: pageModel
    label: |-
      Page
      id / pageNumber / textContent
      bookId (FK)
      timestamps
      @@uniq([bookId,pageNumber])
    type: service
    module: models
    size: xl
    style:
      fillColor: '#BFDBFE'
  - id: illustrationModel
    label: |-
      Illustration
      id / url? / prompt
      pageId (FK)
      timestamps
    type: service
    module: models
    size: xl
    style:
      fillColor: '#BFDBFE'
  - id: storyLibraryModel
    label: |-
      StoryLibrary
      id / title (uniq)
      description? / promptHint?
      timestamps
    type: service
    module: models
    size: xl
    style:
      fillColor: '#BFDBFE'
edges:
  - from: userModel
    to: childProfileModel
    type: primary
    label: 1 ──< N
  - from: userModel
    to: bookModel
    type: primary
    label: 1 ──< N
  - from: childProfileModel
    to: bookModel
    type: primary
    label: 1 ──< N
  - from: bookModel
    to: pageModel
    type: primary
    label: 1 ──< N (cascade)
  - from: pageModel
    to: illustrationModel
    type: primary
    label: 1 ──< N (cascade)
