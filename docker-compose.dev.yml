services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aibook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: elestio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin && mc ready local; do sleep 2; done;
      mc mb --ignore-existing local/aibook;
      mc anonymous set download local/aibook
      "
    restart: "no"

  backend:
    image: node:24-alpine
    working_dir: /app
    command: /bin/sh -lc "npm install && npm run db:generate && npm run db:push && npm --workspace packages/database run seed && npm --workspace apps/backend run start:dev"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./apps/backend/.env
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_BUCKET: aibook
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
