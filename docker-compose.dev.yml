services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aibook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    image: node:24-alpine
    working_dir: /app
    command: /bin/sh -lc "npm install && npm run db:generate && npm run db:push && npm --workspace packages/database run seed && npm --workspace apps/backend run start:dev"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./apps/backend/.env
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
