services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aibook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    image: node:24-slim
    working_dir: /app
    command: /bin/sh -lc "npm install && npm run db:generate && npm run db:push && npm --workspace packages/database run seed && npm --workspace apps/backend run start:dev"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/aibook?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      MOCK_AUTH: "true"
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis

  frontend:
    image: node:24-slim
    working_dir: /app
    command: /bin/sh -lc "npm install && npm --workspace apps/frontend run dev"
    build: .
    volumes:
      - .:/app
      - /app/.turbo
      - /app/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/.next
      - /app/apps/frontend/.turbo
    environment:
      BACKEND_URL: http://backend:3001
      PORT: 3000
      WATCHPACK_POLLING: "true"
      TURBOPACK_POLL_INTERVAL: "1000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
