name: CD

on:
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}"
          docker build -f Dockerfile.backend -t "$IMAGE:sha-${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Save Backend image for scanning
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:sha-${{ github.sha }} -o /tmp/image-backend.tar

      - name: Trivy scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image-backend.tar
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results Backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}"
          docker build -f Dockerfile.frontend -t "$IMAGE:sha-${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Save Frontend image for scanning
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:sha-${{ github.sha }} -o /tmp/image-frontend.tar

      - name: Trivy scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image-frontend.tar
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results Frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM for Backend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: Generate SBOM for Frontend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
          retention-days: 90
